########################################
# INCLUDES
########################################  
[include mainsail.cfg]
[include macros.cfg]
[include FLY_D5.cfg]

########################################
# MCU
########################################
[mcu]
# D5 em modo ponte USB-CAN: fala pela interface can_ender (nao mais por /dev/serial)
canbus_uuid: cb9f5f3a6f91
canbus_interface: can_ender

[mcu EBBCan]
# BTT EBB36 v1.2 na cabeca A4T, na mesma rede CAN da D5
canbus_uuid: a961f4b5f8c1
canbus_interface: can_ender

########################################
# PRINTER
########################################
[printer]
kinematics: cartesian
# Limites pelo SHAPER_CALIBRATE de 2026-10-27 (cabeca A4T + EBB36):
#   X: picos 41 e 92 Hz -> 2hump_ei 67.2 Hz, max_accel sugerido <= 4800
#   Y: pico 37 Hz (mesa)  -> mzv 38.8 Hz,      max_accel sugerido <= 4400  <- limitante
max_velocity: 300
max_accel: 4400
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 100

########################################
# STEPPERS
########################################
[stepper_x]
step_pin: D0_STEP
dir_pin: !D0_DIR
enable_pin: !D0_EN
microsteps: 16
rotation_distance: 40
# X SENSORLESS (TMC2209 StallGuard). Precisa do jumper DIAG do driver X (D0) na D5 e do
# conector XSTOP vazio. Ajustar driver_SGTHRS com o procedimento do SESSION_NOTES.
endstop_pin: tmc2209_stepper_x:virtual_endstop  # sensorless: sem fim de curso fisico no X
position_endstop: 0
position_max: 250  # testado pelo Jakson em 2026-10-27 (cabeca A4T)
homing_speed: 20  # sensorless: rotation_distance/2 (doc do Klipper)
homing_retract_dist: 0

[stepper_y]
step_pin: D1_STEP
dir_pin: !D1_DIR
enable_pin: !D1_EN
microsteps: 16
rotation_distance: 40
endstop_pin: D1_STOP
position_endstop: 0
position_max: 230
homing_speed: 60

[stepper_z]
step_pin: D2_STEP
dir_pin: D2_DIR
enable_pin: !D2_EN
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -8.0
homing_speed: 10

########################################
# TMC DRIVERS
########################################
[tmc2209 stepper_x]
uart_pin: D0_CS
run_current: 0.800  # era 0.700; motores originais da Ender 3 Pro. Conferir temperatura (< ~70 C)
interpolate: true
stealthchop_threshold: 0  # spreadCycle sempre (era 150): mais torque em alta aceleracao
diag_pin: ^D0_STOP  # DIAG do driver X -> jumper DIAG da D5 -> XSTOP (PB4). Exige os pinos DIAG no modulo
driver_SGTHRS: 52  # calibrado em 2026-10-24 com 0.5 A e 20 mm/s: max 60, min ~50 (abaixo estala). Valido so com a corrente do _HOME_X

[tmc2209 stepper_y]
uart_pin: D1_CS
run_current: 0.800  # era 0.700; motores originais da Ender 3 Pro. Conferir temperatura (< ~70 C)
interpolate: true
stealthchop_threshold: 0  # spreadCycle sempre (era 150): mais torque em alta aceleracao

[tmc2209 stepper_z]
uart_pin: D2_CS
run_current: 0.650
interpolate: true
stealthchop_threshold: 150

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.55
interpolate: false
stealthchop_threshold: 0
sense_resistor: 0.110

########################################
# EXTRUDER
########################################
[extruder]
# Extrusor, aquecedor, termistor e fans na EBB36 (migrado em 2026-10-24).
# Mesmos pinos/valores do toolhead.cfg da Trident (mesma cabeca A4T e mesma placa).
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 13.40  # calibrado na Ender em 2026-10-28: pediu 100, entraram 102,3 (13,10 x 1,023)
nozzle_diameter: 0.4
filament_diameter: 1.750
pressure_advance: 0.064  # padrao da Trident (PETG); recalibrar na Ender

# Limites de segurança e segurança contra extrusão a frio
min_extrude_temp: 170
max_extrude_only_distance: 200.00 
max_extrude_cross_section: 99 

heater_pin: EBBCan:PB13
sensor_pin: EBBCan:PA3
sensor_type: NTC 100K MGB18-104F39050L32  # mesmo sensor do hotend da Trident (cabeca A4T)
min_temp: 0
max_temp: 300
max_extrude_only_velocity: 80
max_extrude_only_accel: 600
pullup_resistor: 4700  # padrao da EBB36
full_steps_per_rotation: 200
gear_ratio: 50:17
pressure_advance_smooth_time: 0.040

########################################
# HEATED BED
########################################
[heater_bed]
heater_pin: BED_OUT
sensor_pin: BED_TEMP
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 110

########################################
# TEMPERATURE SENSORS
########################################
[temperature_sensor Fly-D5]
sensor_type: temperature_mcu

[temperature_sensor EBB36_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

########################################
# BLTOUCH & HOMING
########################################
[force_move]
# Libera SET_KINEMATIC_POSITION/FORCE_MOVE (mesmo ajuste da Trident). Usado pra calibrar o X sensorless
# em movimento livre, sem encostar no batente. Pode ser removido depois.
enable_force_move: True

[bltouch]
sensor_pin: ^EBBCan:PB8  # porta Probe da EBB36 (antes ^D3_STOP na D5)
control_pin: EBBCan:PB9  # porta Probe da EBB36 (antes SERVO/PA8 na D5)
pin_move_time: 0.680
x_offset: -38.7  # cabeca A4T: BLTouch 38,7 mm a esquerda do bico
y_offset: 16.6  # 16,6 mm atras do bico
speed: 10
samples: 2
samples_result: median
sample_retract_dist: 5

[safe_z_home]
home_xy_position: 158,126  # bico aqui -> BLTouch em ~119,142 (centro da chapa)
speed: 120
z_hop: 10
z_hop_speed: 50

########################################
# HOMING SENSORLESS DO X
########################################
# O G28 passa por aqui: o X e homado com corrente reduzida (a mesma da calibracao do driver_SGTHRS),
# pausa de 2 s pro flag de stall limpar, e no fim afasta 5 mm do batente. Y e Z seguem o G28 normal
# (safe_z_home). Se mudar HOME_CUR ou o homing_speed do X, recalibrar o driver_SGTHRS.
[gcode_macro G28]
rename_existing: G28.1
description: G28 com homing sensorless do X (corrente reduzida)
gcode:
    {% set todos = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set z_solto = 'z' not in printer.toolhead.homed_axes %}
    {% if z_solto %}
        # sobe o Z uma unica vez; marca Z provisorio pro safe_z_home nao subir de novo a cada eixo
        SET_KINEMATIC_POSITION Z=0
        G90
        G1 Z10 F600
    {% endif %}
    {% if todos or 'X' in params %}
        _HOME_X
    {% endif %}
    {% if todos or 'Y' in params %}
        G28.1 Y
    {% endif %}
    {% if todos or 'Z' in params %}
        G28.1 Z
    {% elif z_solto %}
        SET_KINEMATIC_POSITION CLEAR=Z
    {% endif %}

[gcode_macro _HOME_X]
variable_home_cur: 0.5
gcode:
    {% set run_cur = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
    G4 P2000
    G28.1 X
    SAVE_GCODE_STATE NAME=home_x
    G91
    G1 X5 F1200
    RESTORE_GCODE_STATE NAME=home_x
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_cur}

########################################
# BED MESH
########################################
[bed_mesh]
algorithm: bicubic
speed: 150                   
horizontal_move_z: 8        
mesh_min: 15, 30  # BLTouch: chapa comeca em X=7 / Y=25 (bico)
mesh_max: 210, 230  # X: limite do BLTouch (250-38.7); Y: fim da area imprimivel
probe_count: 6,6              
mesh_pps: 2,2
fade_start: 1.0
fade_end: 10.0
fade_target: 0
zero_reference_position: 119, 142  # ponto onde o Z e homado

########################################
# SCREW TILT
########################################
[screws_tilt_adjust]
screw1: 66.4, 27.4
screw1_name: Frente-Esquerda
screw2: 250, 27.4  # bico no X maximo -> BLTouch em X 211.3 (o mais a direita possivel)
screw2_name: Frente-Direita
screw3: 66.4, 197.4
screw3_name: Trás-Esquerda
screw4: 250, 197.4  # bico no X maximo -> BLTouch em X 211.3
screw4_name: Trás-Direita
speed: 150
horizontal_move_z: 8
screw_thread: CW-M4

[gcode_macro SCREWS_CALCULATE]
gcode:
    SCREWS_TILT_CALCULATE

########################################
# ADXL + INPUT SHAPER
########################################
# ADXL345 avulso ligado na D5 (spi2), preso na MESA pra medir o eixo Y
[adxl345]
cs_pin: PB12
spi_bus: spi2

# ADXL345 da propria EBB36 (SPI2 da placa), usado pro eixo X (fica na cabeca)
[adxl345 ebb]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip_x: adxl345 ebb  # cabeca (X)
accel_chip_y: adxl345      # mesa (Y)
probe_points:
    117, 117, 50

[input_shaper]
# valores salvos automaticamente abaixo

########################################
# FANS
########################################
[fan]
pin: EBBCan:PA1  # ventilador de peca (mesma ligacao da Trident)

[heater_fan ventoinha_hotend]
pin: EBBCan:PA0  # ventilador do hotend (mesma ligacao da Trident)
max_power: 1.0
shutdown_speed: 0.0
heater: extruder
heater_temp: 50.0

########################################
# VIRTUAL SD
########################################
[virtual_sdcard]
path: /home/biqu/printer_Ender3_data/gcodes

[display_status]
[pause_resume]
[exclude_object]


