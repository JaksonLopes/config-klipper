########################################
# INCLUDES
########################################  
[include mainsail.cfg]
[include macros.cfg]
[include FLY_D5.cfg]

########################################
# MCU
########################################
[mcu]
# D5 em modo ponte USB-CAN: fala pela interface can_ender (nao mais por /dev/serial)
canbus_uuid: cb9f5f3a6f91
canbus_interface: can_ender

[mcu EBBCan]
# BTT EBB36 v1.2 na cabeca A4T, na mesma rede CAN da D5
canbus_uuid: a961f4b5f8c1
canbus_interface: can_ender

########################################
# PRINTER
########################################
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
max_z_velocity: 15           
max_z_accel: 100              

########################################
# STEPPERS
########################################
[stepper_x]
step_pin: D0_STEP
dir_pin: !D0_DIR
enable_pin: !D0_EN
microsteps: 16
rotation_distance: 40
# X SENSORLESS (TMC2209 StallGuard). Precisa do jumper DIAG do driver X (D0) na D5 e do
# conector XSTOP vazio. Ajustar driver_SGTHRS com o procedimento do SESSION_NOTES.
endstop_pin: tmc2209_stepper_x:virtual_endstop  # sensorless: sem fim de curso fisico no X
position_endstop: 0
position_max: 247
homing_speed: 20  # sensorless: rotation_distance/2 (doc do Klipper)
homing_retract_dist: 0

[stepper_y]
step_pin: D1_STEP
dir_pin: !D1_DIR
enable_pin: !D1_EN
microsteps: 16
rotation_distance: 40
endstop_pin: D1_STOP
position_endstop: 0
position_max: 230
homing_speed: 40

[stepper_z]
step_pin: D2_STEP
dir_pin: D2_DIR
enable_pin: !D2_EN
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -8.0

########################################
# TMC DRIVERS
########################################
[tmc2209 stepper_x]
uart_pin: D0_CS
run_current: 0.700
interpolate: true
stealthchop_threshold: 150
diag_pin: ^D0_STOP  # DIAG do driver X -> jumper DIAG da D5 -> XSTOP (PB4). Exige os pinos DIAG no modulo
driver_SGTHRS: 255  # 255 = mais sensivel; calibrar pra baixo (SET_TMC_FIELD ... FIELD=SGTHRS)

[tmc2209 stepper_y]
uart_pin: D1_CS
run_current: 0.700
interpolate: true
stealthchop_threshold: 150

[tmc2209 stepper_z]
uart_pin: D2_CS
run_current: 0.650
interpolate: true
stealthchop_threshold: 150

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.55
interpolate: false
stealthchop_threshold: 0
sense_resistor: 0.110

########################################
# EXTRUDER
########################################
[extruder]
# Extrusor, aquecedor, termistor e fans na EBB36 (migrado em 2026-10-24).
# Mesmos pinos/valores do toolhead.cfg da Trident (mesma cabeca A4T e mesma placa).
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 13.10  # valor da Trident (A4T com engrenagem 50:17); calibrar na Ender
nozzle_diameter: 0.4
filament_diameter: 1.750
pressure_advance: 0.064  # padrao da Trident (PETG); recalibrar na Ender

# Limites de segurança e segurança contra extrusão a frio
min_extrude_temp: 170
max_extrude_only_distance: 200.00 
max_extrude_cross_section: 99 

heater_pin: EBBCan:PB13
sensor_pin: EBBCan:PA3
sensor_type: NTC 100K MGB18-104F39050L32  # mesmo sensor do hotend da Trident (cabeca A4T)
min_temp: 0
max_temp: 300
max_extrude_only_velocity: 80
max_extrude_only_accel: 600
pullup_resistor: 4700  # padrao da EBB36
full_steps_per_rotation: 200
gear_ratio: 50:17
pressure_advance_smooth_time: 0.040

########################################
# HEATED BED
########################################
[heater_bed]
heater_pin: BED_OUT
sensor_pin: BED_TEMP
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 110

########################################
# TEMPERATURE SENSORS
########################################
[temperature_sensor Fly-D5]
sensor_type: temperature_mcu

[temperature_sensor EBB36_mcu]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

########################################
# BLTOUCH & HOMING
########################################
[force_move]
# Libera SET_KINEMATIC_POSITION/FORCE_MOVE (mesmo ajuste da Trident). Usado pra calibrar o X sensorless
# em movimento livre, sem encostar no batente. Pode ser removido depois.
enable_force_move: True

[bltouch]
sensor_pin: ^D3_STOP
control_pin: SERVO
pin_move_time: 0.680
x_offset: -45
y_offset: -1
speed: 10
samples: 2
samples_result: median
sample_retract_dist: 5

[safe_z_home]
home_xy_position: 153,125
speed: 50
z_hop: 0  # TEMPORARIO (BLTouch desligado): com Z nao homed cada G28 subia o Z 10 mm. Voltar pra 10 quando o BLTouch for ligado.
z_hop_speed: 50

########################################
# BED MESH
########################################
[bed_mesh]
algorithm: bicubic
speed: 150                   
horizontal_move_z: 8        
mesh_min: 10, 15
mesh_max: 200, 210
probe_count: 6,6              
mesh_pps: 2,2
fade_start: 1.0
fade_end: 10.0
fade_target: 0
zero_reference_position: 153, 125

########################################
# SCREW TILT
########################################
[screws_tilt_adjust]
screw1: 72.7, 45
screw1_name: Frente-Esquerda
screw2: 242.7, 45
screw2_name: Frente-Direita
screw3: 72.7, 215
screw3_name: Trás-Esquerda
screw4: 242.7, 215
screw4_name: Trás-Direita
speed: 150
horizontal_move_z: 8
screw_thread: CW-M4

[gcode_macro SCREWS_CALCULATE]
gcode:
    SCREWS_TILT_CALCULATE

########################################
# ADXL + INPUT SHAPER
########################################
[adxl345]
cs_pin: PB12
spi_bus: spi2

[resonance_tester]
accel_chip: adxl345
probe_points:
    117, 117, 50

[input_shaper]
# valores salvos automaticamente abaixo

########################################
# FANS
########################################
[fan]
pin: EBBCan:PA1  # ventilador de peca (mesma ligacao da Trident)

[heater_fan ventoinha_hotend]
pin: EBBCan:PA0  # ventilador do hotend (mesma ligacao da Trident)
max_power: 1.0
shutdown_speed: 0.0
heater: extruder
heater_temp: 50.0

########################################
# VIRTUAL SD
########################################
[virtual_sdcard]
path: /home/biqu/printer_Ender3_data/gcodes

[display_status]
[pause_resume]
[exclude_object]


