[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(230)|float %}
    
    M140 S{BED_TEMP}
    M104 S150
    
    G28 
    
    M190 S{BED_TEMP}

    # O bico fica a 150C (nao no valor de impressao) ate o tap, pra nao danificar o PEI.
    # LIMPAR_BICO ja espera os 150C sozinho (M109 S150 quando o alvo < 180).
    LIMPAR_BICO

    Z_TILT_ADJUST

    G28 z

    # Re-zera o Z pelo contato real do bico na mesa (sonda Eddy em modo tap) - a posicao
    # de homing do Z pela frequencia da sonda deriva com a temperatura. Zera tambem
    # qualquer ajuste manual de Z (SET_GCODE_OFFSET) que tenha ficado de impressao anterior.
    SET_GCODE_OFFSET Z=0
    AJUSTAR_Z_TAP

    # Malha ainda com o bico a 150C (fluxo da doc do tap): bico a 240C esquentaria a bobina
    # da Eddy durante o scan, que e o pior momento pra deriva. A dilatacao do bico fica por
    # conta do tap_z_offset (toolhead.cfg). So depois aquece ate a temperatura de impressao.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD=rapid_scan

    M104 S{EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-1} MAXIMUM={EXTRUDER_TEMP+2}
    LIMPAR_BICO


[gcode_macro PRINT_END]
gcode:
    # 1. Armazena limites de movimento para segurança
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    # 2. Verifica se a posição atual permite subir o Z com segurança
    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    M400                          # Espera o buffer de movimentos limpar
    G92 E0                        # Reseta o extrusor
    G1 E-5.0 F3600                # Retração rápida de 5mm (evita "stringing" no fim)
    
    G91                           # Posicionamento Relativo
    G1 Z{z_safe} F3000            # Sobe o bico para não bater na peça
    
    G90                           # Posicionamento Absoluto
    G1 X{max_x / 2} Y{max_y - 10} F6000 # Move o bico para o fundo centralizado
    
    M104 S0                       # Desliga bico
    M140 S0                       # Desliga mesa
    M107                          # Desliga fans de resfriamento da peça

    M84                           # Desativa os motores (o PRINT_START já faz G28 no início, então perder o home aqui não é problema)

    M117 Impressao concluida!

[gcode_macro LIMPAR_BICO]
gcode:
    # Garante que as coordenadas estão em modo absoluto
    G90 
    
    # Verifica se o bico está quente o suficiente para não quebrar a escova
    {% if printer.extruder.target < 180 %}
        M117 Aquecendo para limpar...
        M109 S150 ; Espera atingir 200°C (ajuste se preferir outra temperatura)
    {% endif %}

    M117 Limpando o bico...

    # 1. Mover rápido para o início da escova de latão do Decontaminator
    G1 X52 Y304 F9000                   ; Vai para o início da escova

    # 2. Executa o movimento de vai e vem na escova (X52 até X15)
    G1 X15 Y304 F6000                   ; Passada 1
    G1 X52 Y304 F6000                   ; Passada 1 (volta)
    G1 X15 Y304 F6000                   ; Passada 2
    G1 X52 Y304 F6000                   ; Passada 2 (volta)
    G1 X15 Y304 F6000                   ; Passada 3

    G1 X52 Y304 F9000                   ; Afasta o bico da escova
    M117 Bico Limpo!

[gcode_macro AJUSTAR_Z_TAP]
description: Re-zera o Z pelo contato real do bico na mesa (Eddy em modo tap). Precisa de Z ja homeado, bico limpo e a ~150C. Uso: AJUSTAR_Z_TAP [SAMPLES=3]
gcode:
    {% set samples = params.SAMPLES|default(3)|int %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        {action_raise_error("AJUSTAR_Z_TAP: faca G28 antes")}
    {% endif %}
    {% if printer.extruder.temperature > 175 %}
        {action_raise_error("AJUSTAR_Z_TAP: bico a %.0fC, quente demais pra encostar na mesa (PEI). Esfrie pra ~150C." % printer.extruder.temperature)}
    {% endif %}
    G90
    # O tap exige o bico entre 3 e 20 mm da mesa; sobe antes de ir ao ponto de referencia
    G1 Z10 F600
    # X150 Y125 = ponto do bico quando a sonda esta em zero_reference_position (150,150)
    G1 X150 Y125 F9000
    M400
    # O padrao do tap aceita uma amostra ate 0.1mm fora sem reclamar; aqui exige 0.02mm,
    # refaz ate 2x e usa a mediana. (As opcoes do bloco [probe_eddy_current] nao valem pro tap.)
    PROBE METHOD=tap SAMPLES={samples} SAMPLES_TOLERANCE=0.02 SAMPLES_TOLERANCE_RETRIES=2 SAMPLES_RESULT=median
    _AJUSTAR_Z_TAP_APLICA

[gcode_macro _AJUSTAR_Z_TAP_APLICA]
description: Parte 2 do AJUSTAR_Z_TAP (separada porque o Jinja so enxerga o resultado do PROBE depois que ele roda)
gcode:
    # last_z_result esta deprecated no Klipper (sera removido); last_probe_position.z e o
    # mesmo valor pro tap (ja inclui o tap_z_offset)
    {% set pos = printer.probe.last_probe_position|default(none) %}
    {% if pos is none %}
        {action_raise_error("AJUSTAR_Z_TAP: o PROBE nao devolveu resultado")}
    {% endif %}
    {% set contato = pos.z|float %}
    {% if contato < -0.3 or contato > 0.3 %}
        {action_raise_error("AJUSTAR_Z_TAP: contato em Z=%.3f fora de +/-0.3mm - nao aplicado (sujeira no bico/mesa?)" % contato)}
    {% endif %}
    {% set z_novo = printer.toolhead.position.z|float - contato %}
    RESPOND MSG="AJUSTAR_Z_TAP: contato em Z={'%.4f' % contato}, Z corrigido em {'%+.4f' % (0 - contato)} mm"
    SET_KINEMATIC_POSITION Z={z_novo}
    G1 Z10 F600

[gcode_macro CORTE_FILAMENTO]
gcode:
    _MMU_CUT_TIP


[gcode_macro CALIBRAR_IMPRESSORA]
description: Rotina completa de calibracao (PID do bico e da mesa, Z-tilt, malha da mesa e teste de ressonancia). Uso: CALIBRAR_IMPRESSORA [BED=100] [HOTEND=250]
gcode:
    {% set BED_TEMP = params.BED|default(100)|float %}
    {% set HOTEND_TEMP = params.HOTEND|default(250)|float %}

    M117 Calibrando: home inicial...
    G28

    # 1. PID da extrusora (desliga o bico sozinho ao terminar)
    M117 PID do bico a {HOTEND_TEMP}C...
    PID_CALIBRATE HEATER=extruder TARGET={HOTEND_TEMP}
    M104 S0

    # 2. PID da mesa (desliga a mesa sozinho ao terminar)
    M117 PID da mesa a {BED_TEMP}C...
    PID_CALIBRATE HEATER=heater_bed TARGET={BED_TEMP}

    # 3. Reaquece a mesa antes do nivelamento/malha - reflete a condicao real de
    #    impressao e bate com a faixa em que a sonda Eddy foi calibrada
    #    (calibration_bed_temp: 100 no toolhead.cfg)
    M117 Aquecendo a mesa para nivelamento a quente...
    M190 S{BED_TEMP}

    # 4. Z-tilt: nivela os 3 motores de Z independentes
    M117 Ajustando Z-tilt...
    Z_TILT_ADJUST
    G28 Z

    # 5. Malha da mesa - METHOD=scan (mais precisa que o rapid_scan usado no PRINT_START)
    M117 Fazendo a malha da mesa...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE METHOD=scan

    M140 S0

    # 6. Teste de ressonancia / input shaper (X e Y), bico e mesa ja frios
    M117 Testando ressonancia (X e Y)...
    SHAPER_CALIBRATE

    M117 Calibracao concluida!
    RESPOND MSG="Calibracao concluida: PID (bico/mesa), Z-tilt, malha e input shaper foram aplicados na memoria (RAM). Confira os valores no console e rode SAVE_CONFIG quando estiver satisfeito - isso grava tudo no printer.cfg e reinicia o Klipper."

[gcode_macro _MMU_PURGE_CUSTOM]
description: Alterna entre os dois baldes do Decontaminator e purga, antes de rodar o código original do Happy Hare
variable_next_bucket_x: 1	; Próximo balde a usar (0 ou 60) - alterna a cada purga
gcode:
    # 1. Decide qual dos dois baldes usar desta vez e já inverte pra próxima purga
    {% set bucket_x = printer["gcode_macro _MMU_PURGE_CUSTOM"].next_bucket_x %}
    SET_GCODE_VARIABLE MACRO=_MMU_PURGE_CUSTOM VARIABLE=next_bucket_x VALUE={60 if bucket_x == 1 else 1}

    MMU_LOG MSG="Movendo para o balde de purga do Decontaminator (X{bucket_x} Y310)..."

    # 2. Garante coordenadas absolutas e viaja rápido até o balde escolhido
    G90
    G1 X{bucket_x} Y310 F9000

    # 3. Chama a macro de purga padrão diretamente (NÃO o comando MMU_PURGE,
    # que re-chamaria a purge_macro configurada e causaria loop infinito)
    _MMU_PURGE

    # 4. Limpa o bico na escova antiga depois de purgar (fica aqui, e não no
    # mmu_macro_vars.cfg, porque esse arquivo é sobrescrito pelo instalador
    # do Happy Hare a cada atualização)
    LIMPAR_BICO


[gcode_macro TESTE_SELETOR]
description: Teste de estresse do seletor da MMX: escolhe gates aleatorios (nunca o mesmo duas vezes seguidas). Uso: TESTE_SELETOR [VEZES=40] [PAUSA=0.5]. Descarregue o filamento antes (MMU_SELECT recusa com filamento carregado).
gcode:
    {% set vezes = params.VEZES|default(40)|int %}
    {% set pausa = params.PAUSA|default(0.5)|float %}
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("TESTE_SELETOR nao pode rodar durante uma impressao")}
    {% endif %}
    {% set ns = namespace(ultimo=(printer.mmu.gate|default(-1)|int)) %}
    RESPOND MSG="TESTE_SELETOR: {vezes} selecoes aleatorias (cerca de {(vezes * 3 / 60)|round(1)} min). Escute o servo e a engrenagem."
    {% for i in range(vezes) %}
        {% set g = (range(0, 4)|random) %}
        {% if g == ns.ultimo %}
            {% set g = (g + 1 + (range(0, 3)|random)) % 4 %}
        {% endif %}
        {% set ns.ultimo = g %}
        RESPOND MSG="TESTE_SELETOR {i + 1}/{vezes}: gate {g}"
        MMU_SELECT GATE={g}
        G4 P{(pausa * 1000)|int}
    {% endfor %}
    RESPOND MSG="TESTE_SELETOR concluido sem erros: {vezes} selecoes."
    SERVO_GEAR_BUZZ
