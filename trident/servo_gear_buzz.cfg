# Mexe a engrenagem de arrasto da MMX enquanto o servo engata um gate, para os dentes
# não ficarem um em cima do outro. Precisa do módulo extras/servo_gear_buzz.py linkado em
# ~/klipper/klippy/extras (ver trident/SESSION_NOTES.md, item 35).
# Ajuste ao vivo pelo console: SERVO_GEAR_BUZZ COUNT=5 DISTANCE=0.8 SPEED=25
[servo_gear_buzz]
buzz_count: 5          # Ciclos de vai-e-volta por engate (0 desativa, máx 10)
buzz_distance: 0.8     # mm de cada lado (mesmo valor do servo_buzz_gear_on_down oficial)
buzz_speed: 25         # mm/s (mesmo valor oficial)
