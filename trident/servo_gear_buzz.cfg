# Mexe a engrenagem de arrasto da MMX enquanto o servo engata um gate, para os dentes
# não ficarem um em cima do outro, e permite deixar o servo mais lento.
# Precisa do módulo extras/servo_gear_buzz.py linkado em ~/klipper/klippy/extras
# (ver trident/SESSION_NOTES.md, item 35).
# Ajuste ao vivo pelo console: SERVO_GEAR_BUZZ COUNT=5 DISTANCE=1.0 SERVO_SPEED=90
[servo_gear_buzz]
buzz_count: 5          # Ciclos de vai-e-volta por engate (0 desativa, máx 10)
buzz_distance: 1.0     # mm de cada lado (o oficial usa 0.8)
buzz_speed: 25         # mm/s (mesmo valor oficial)
servo_speed: 120       # graus/s do servo entre gates (0 = velocidade máxima do servo, sem suavizar)
servo_step: 3          # tamanho de cada passo intermediário, em graus
sweep_buzz_degrees: 12 # mexe a engrenagem a cada N graus de giro do servo ao engatar (0 = só no fim)
