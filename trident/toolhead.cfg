#####################################################################
#    CABEÇOTE - PLACA EBB36 (Toolboard) + SONDA EDDY
#####################################################################

# ---------------------------------------------------------------
# EBB36 - Placa da ferramenta (extrusora, fans, endstop X)
# ---------------------------------------------------------------
[mcu ebb36]
canbus_uuid: f5fa191a0e2e

## SENSOR DE TEMPERATURA DA PLACA (Monitoramento do chip)
[temperature_sensor EBB36_Temp]
sensor_type: temperature_mcu
sensor_mcu: ebb36

## EXTRUSORA COM SENSOR BAMBU LAB
[extruder]
sensor_type: NTC 100K MGB18-104F39050L32
step_pin: ebb36:PD0
dir_pin: !ebb36:PD1
enable_pin: !ebb36:PD2
heater_pin: ebb36:PB13
sensor_pin: ebb36:PA3

max_extrude_only_distance: 700.00
max_extrude_cross_section: 99
full_steps_per_rotation: 200
filament_diameter: 1.750
rotation_distance: 13.10
nozzle_diameter: 0.400
pullup_resistor: 4700 # Padrão da EBB36
gear_ratio: 50:17
microsteps: 16
min_extrude_temp: 170
max_temp: 300
min_temp: 0
# pressure_advance: .05
# pressure_advance_smooth_time: 0.040


[tmc2209 extruder]
uart_pin: ebb36:PA15
run_current: 0.55
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: false

[fan]
pin: ebb36:PA1

[heater_fan hotend_fan]
pin: ebb36:PA0
heater: extruder
max_power: 1.0
kick_start_time: 0.5
heater_temp: 50.0


# ---------------------------------------------------------------
# Eddy - Sonda de corrente parasita (nivelamento e homing Z)
# ---------------------------------------------------------------
[mcu eddy]
canbus_uuid: f016a381c73d # Endereço serial da sonda Eddy (ver com `ls /dev/serial/by-id` via SSH)

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100


[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy  # Valor correto para Eddy USB - ajustar se usar Eddy Coil
i2c_bus: i2c0f # Valor correto para Eddy USB - ajustar se usar Eddy Coil
i2c_speed: 4000000
x_offset: 0                  # Coordenadas com base no cabeçote Archetype 4T
y_offset: 25
# samples: 1
# samples_result: median
# samples_tolerance: 0.01
# samples_tolerance_retries: 3
descend_z: 0.5


[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 5
calibration_position: 150, 125, 0.5
calibration_extruder_temp: 170
calibration_bed_temp: 100
extruder_heating_z: 50


[force_move]
enable_force_move: True # Permite descer o Z manualmente se não houver outro meio de homing (calibração do Eddy)

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90 # Posicionamento absoluto
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 } # Permite descer até tocar
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy
