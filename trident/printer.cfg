# Happy Hare MMU includes (should be near top of file)
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
#####################################################################
#    ARQUIVOS DE CONFIGURAÇÃO EXTERNOS
#####################################################################
# # --------------------------------------------------------------------
# [include mmu/addons/blobifier.cfg]
# [include mmu/addons/mmu_erec_cutter.cfg]  # Nao usado: corte e feito no cabecote (A4T-AFC), nao na MMU
# --------------------------------------------------------------------

[include mainsail.cfg]        # Interface web Mainsail
[include toolhead.cfg]        # Cabeçote: placa EBB36 (extrusora/fans) + sonda Eddy
[include steppers.cfg]        # Motores X/Y/Z/Z1/Z2 e input shaper
[include bed_leveling.cfg]    # Homing, Z-tilt e malha da mesa
[include heaters_fans.cfg]    # Mesa aquecida, sensores de temperatura e fan da eletrônica
[include misc.cfg]            # Configurações gerais do sistema (idle timeout, sdcard, exclude_object)
[include macros.cfg]          # Suas macros (PRINT_START, etc.)
[include servo_gear_buzz.cfg] # Mexe a engrenagem da MMX no engate do servo (dente-com-dente)

# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
[include mmu/optional/client_macros.cfg]

#####################################################################
#    CONEXÃO E CINEMÁTICA
#####################################################################
[mcu]
canbus_uuid: fdfd50e92d20  # ID único de comunicação da placa principal via CANbus

[gcode_arcs]                 # Habilita G2/G3 (movimento em arco) - Orca estava mandando e o Klipper ignorava
#resolution: 1.0             # mm por segmento (default), arcos menores que isso viram reta

[printer]
kinematics: corexy           # Estilo de movimento (X e Y trabalham juntos)
max_velocity: 500            # Velocidade máxima de deslocamento (mm/s)
max_accel: 8000              # Aceleração máxima (mm/s²)
max_z_velocity: 15           # Velocidade máxima do eixo Z (mesmo do sample Voron; era 5)
max_z_accel: 300             # Aceleração do eixo Z (a doc do tap exige >35 e recomenda 300; era 100)
square_corner_velocity: 5.0  # Velocidade de entrada em curvas/cantos

